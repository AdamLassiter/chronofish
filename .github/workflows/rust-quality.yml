name: Rust quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust-quality:
    name: Cargo check, fix, test
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        continue-on-error: true
        run: cargo check --workspace --all-targets

      - name: Cargo fmt check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        continue-on-error: true
        run: cargo test --workspace

      - name: Build WASM engine
        continue-on-error: true
        run: cargo build --release --manifest-path engine/Cargo.toml --target wasm32-unknown-unknown

      - name: Cargo fix
        continue-on-error: true
        run: cargo fix --workspace --all-targets --allow-dirty --allow-staged

      - name: Cargo clippy fix
        continue-on-error: true
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings
