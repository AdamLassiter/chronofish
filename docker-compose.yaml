name: chronofish

services:
  server:
    image: ${CHRONOFISH_IMAGE:-chronofish:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CHRONOFISH_PORT:-3000}:3000"
    environment:
      CHRONOFISH_ADDR: 0.0.0.0:3000
      CHRONOFISH_DATABASE: /data/chronofish.sqlite3
      CHRONOFISH_AZ_SIMULATIONS: ${CHRONOFISH_AZ_SIMULATIONS:-48}
      CHRONOFISH_BUG_ADMIN_TOKEN: ${CHRONOFISH_BUG_ADMIN_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
      # To use a trained model, uncomment this and the bind mount below. A model
      # trained on CPU or GPU works; inference always runs on the CPU.
      # CHRONOFISH_AZ_MODEL: /models/chronofish-best-v2.json
    volumes:
      - chronofish-data:/data
      # - ./models/training/best-v2.json:/models/chronofish-best-v2.json:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  chronofish-data:
