[package]
name = "chronofish-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal interface for Chronofish"

[[bin]]
name = "chronofish"
path = "src/main.rs"

[dependencies]
kairos = { path = "../kairos" }
chronofish-ftxi = { path = "../ftxi" }
clap = { version = "4", features = ["derive"] }
chronofish-alphazero = { path = "../alphazero" }
chronofish-classic = { path = "../classic" }
chronofish-core = { path = "../core" }
chronofish-notation = { path = "../notation", features = ["chronofish"] }

[lints]
workspace = true
