[package]
name = "chronofish-benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Repeatable release-mode throughput regression checks for Chronofish"

[dependencies]
kairos = { path = "../kairos" }
chronofish-ftxi = { path = "../ftxi" }
chronofish-alphazero = { path = "../alphazero" }
chronofish-classic = { path = "../classic" }
chronofish-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
rand_chacha = "0.9"
rayon = "1"
ratatui = "0.30"

[dev-dependencies]
chronofish-notation = { path = "../notation", features = ["chronofish"] }

[lints]
workspace = true
