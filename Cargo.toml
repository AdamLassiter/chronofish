[workspace]
members = [
    "crates/5d-rules",
    "crates/5d-rules-reference",
    "crates/alphazero",
    "crates/benchmarks",
    "crates/classic",
    "crates/kairos",
    "crates/kairos-tools",
    "crates/ftxi",
    "crates/core",
    "crates/neural",
    "crates/notation",
    "crates/server",
    "crates/trainer",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
