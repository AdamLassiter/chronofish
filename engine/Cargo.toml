[package]
name = "chronofish-engine"
version = "0.5.0"
edition = "2021"
description = "Rust/WASM engine core for Chronofish"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "0.21", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"] }
futures-lite = { version = "2.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-timer = "0.2"
wgpu = { version = "29.0", optional = true }

[features]
default = []
neural-cpu = ["dep:burn", "burn/ndarray"]
neural-wgpu = ["dep:burn", "burn/wgpu", "dep:futures-lite", "dep:wgpu"]
neural-rocm = ["dep:burn", "burn/rocm"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
pretty-log = { path = "../pretty-log" }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
