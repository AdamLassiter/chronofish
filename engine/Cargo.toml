[package]
name = "chronofish-engine"
version = "0.1.4"
edition = "2021"
description = "Rust/WASM engine core for Chronofish"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-timer = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
